name: staging-equivalent-validation
on:
  workflow_dispatch:
  pull_request:
  push:
    paths: ['apps/control-plane-api/**', 'packages/**', 'scripts/**', '.github/workflows/staging-validation.yml']
jobs:
  staging-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cerebrum_admin, POSTGRES_PASSWORD: validation-only, POSTGRES_DB: cerebrum_validation }
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U cerebrum_admin -d cerebrum_validation"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      RUNTIME_PROFILE: STAGING_TEST
      DATABASE_URL: postgresql://cerebrum_app:validation-only@127.0.0.1:5432/cerebrum_validation
      MIGRATOR_DATABASE_URL: postgresql://cerebrum_admin:validation-only@127.0.0.1:5432/cerebrum_validation
      MIGRATOR_ROLE: cerebrum_migrator
      APPLICATION_ROLE: cerebrum_app
      AUDIT_ROLE: cerebrum_audit
      OIDC_ISSUER: http://127.0.0.1:8899
      OIDC_AUDIENCE: cerebrum-control-plane
      OIDC_JWKS_URL: http://127.0.0.1:8899/.well-known/jwks.json
      RECEIPT_SIGNING_TEST_KEY: ci-validation-key
      AUDIT_LOGGING: 'true'
      TENANT_ISOLATION_ENFORCEMENT: 'true'
      API_HOST: 127.0.0.1
      API_PORT: '8787'
      CORS_ORIGIN: http://127.0.0.1:4173
      CEREBRUM_API_URL: http://127.0.0.1:8787
      CEREBRUM_ARTIFACT_DIR: ${{ github.workspace }}/artifacts
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: command-center/package-lock.json }
      - name: Install dependencies
        working-directory: command-center
        run: npm ci && npm install --no-save pg
      - name: Install API runtime dependency
        run: npm install --no-save --prefix apps/control-plane-api pg
      - name: Build contracts, core, testkit and API
        run: |
          set -euo pipefail
          command-center/node_modules/.bin/tsc -p packages/contracts/tsconfig.json
          command-center/node_modules/.bin/tsc -p packages/platform-core/tsconfig.json
          command-center/node_modules/.bin/tsc -p packages/platform-testkit/tsconfig.json
          command-center/node_modules/.bin/tsc -p apps/control-plane-api/tsconfig.json
      - name: Create database roles
        run: |
          set -euo pipefail
          psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN CREATE ROLE cerebrum_migrator NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE cerebrum_app NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE cerebrum_audit NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          ALTER ROLE cerebrum_app LOGIN PASSWORD 'validation-only';
          ALTER ROLE cerebrum_audit LOGIN PASSWORD 'validation-only';
          GRANT CONNECT ON DATABASE cerebrum_validation TO cerebrum_app, cerebrum_audit;
          SQL
      - name: Apply migrations and verify version
        run: |
          set -euo pipefail
          for migration in apps/control-plane-api/migrations/*.sql; do psql "$MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
          test "$(psql "$MIGRATOR_DATABASE_URL" -At -c "SELECT string_agg(version, ',' ORDER BY version) FROM schema_migrations")" = "001_initial,002_security,003_lifecycle_records,004_projection_permissions"
      - name: Start temporary OIDC issuer
        run: |
          mkdir -p "$ARTIFACT_DIR"
          node scripts/oidc-test-issuer.mjs > $ARTIFACT_DIR/oidc.log 2>&1 & echo $! > $ARTIFACT_DIR/oidc.pid
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8899/.well-known/jwks.json >/dev/null; then break; fi; sleep 1; done
          token="$(curl -fsS 'http://127.0.0.1:8899/token' | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).access_token))")"
          test -n "$token"
          echo "CEREBRUM_AUTH_TOKEN=$token" >> "$GITHUB_ENV"
          durability_token="$(curl -fsS 'http://127.0.0.1:8899/token?role=auditor' | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).access_token))")"
          test -n "$durability_token"
          echo "CEREBRUM_DURABILITY_TOKEN=$durability_token" >> "$GITHUB_ENV"
          echo "CEREBRUM_DURABILITY_ACTOR=audit-01" >> "$GITHUB_ENV"
          echo "CEREBRUM_DURABILITY_ROLE=auditor" >> "$GITHUB_ENV"
          echo "CEREBRUM_DURABILITY_TENANT=meridian-demo" >> "$GITHUB_ENV"
      - name: Start compiled API
        run: |
          set -euo pipefail
          test -f apps/control-plane-api/dist/apps/control-plane-api/src/start.js
          test -f apps/control-plane-api/dist/apps/control-plane-api/src/server.js
          node apps/control-plane-api/dist/apps/control-plane-api/src/start.js > $ARTIFACT_DIR/api.log 2>&1 &
          echo $! > $ARTIFACT_DIR/api.pid
          sleep 2
          if ! kill -0 "$(cat $ARTIFACT_DIR/api.pid)" 2>/dev/null; then cat $ARTIFACT_DIR/api.log; exit 1; fi
      - name: Wait for readiness
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:8787/healthz >/dev/null && curl -fsS http://127.0.0.1:8787/readyz >/dev/null; then exit 0; fi; sleep 1; done
          cat $ARTIFACT_DIR/api.log; exit 1
      - name: Run validation
        working-directory: command-center
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'code=$?;
            safe_command="${BASH_COMMAND//validation-only/[REDACTED]}";
            safe_command="${safe_command//CEREBRUM_AUTH_TOKEN=[^ ]*/CEREBRUM_AUTH_TOKEN=[REDACTED]}";
            echo "::error::Command failed at line ${LINENO}: ${safe_command} (exit ${code})";
            for log in "$ARTIFACT_DIR/api.log" "$ARTIFACT_DIR/api-restart.log" "$ARTIFACT_DIR/oidc.log"; do
              if test -f "$log"; then
                echo "===== $log =====";
                tail -n 200 "$log";
              fi;
            done;
            exit "$code"' ERR
          npm run test:staging
      - name: Validate transaction concurrency
        run: |
          set -Eeuo pipefail
          node scripts/transaction-concurrency-validation.mjs
      - name: Validate identity, tenant isolation and role permissions
        run: |
          set -Eeuo pipefail
          trap 'rc=$?;
            echo "::error::FAILED line=${LINENO} exit=${rc} command=${BASH_COMMAND}";
            for log in "$ARTIFACT_DIR"/api*.log "$ARTIFACT_DIR"/oidc*.log; do
              if test -f "$log"; then
                echo "::group::$log";
                tail -n 200 "$log";
                echo "::endgroup::";
              fi
            done;
            exit "$rc"' ERR
          echo "Running identity token validation"
          node scripts/identity-tenant-validation.mjs
          echo "Checking tenant-scoped journal visibility"
          own="$(PGOPTIONS='-c app.tenant_id=meridian-demo' psql "$DATABASE_URL" -At -c "SELECT count(*) FROM journal_events")"
          other="$(PGOPTIONS='-c app.tenant_id=other-tenant' psql "$DATABASE_URL" -At -c "SELECT count(*) FROM journal_events")"
          missing="$(PGOPTIONS='-c app.tenant_id=' psql "$DATABASE_URL" -At -c "SELECT count(*) FROM journal_events")"
          echo "Asserting own tenant has records: $own"
          if ! test "$own" -gt 0; then echo "::error::Own-tenant journal count is zero"; exit 1; fi
          echo "Asserting other tenant is isolated: $other"
          if ! test "$other" = 0; then echo "::error::Cross-tenant journal read returned $other records"; exit 1; fi
          echo "Asserting missing tenant context is denied: $missing"
          if ! test "$missing" = 0; then echo "::error::Missing tenant context returned $missing records"; exit 1; fi
          echo "Checking projection privileges"
          test "$(psql "$DATABASE_URL" -At -c "SELECT has_table_privilege(current_user, 'state_snapshots', 'UPDATE')")" = t
          test "$(psql "$DATABASE_URL" -At -c "SELECT has_table_privilege(current_user, 'incidents', 'UPDATE')")" = t
          test "$(psql "$DATABASE_URL" -At -c "SELECT has_table_privilege(current_user, 'proposals', 'UPDATE')")" = f
          test "$(psql "$DATABASE_URL" -At -c "SELECT has_table_privilege(current_user, 'kernel_decisions', 'UPDATE')")" = f
          test "$(psql "$DATABASE_URL" -At -c "SELECT has_table_privilege(current_user, 'outcomes', 'UPDATE')")" = f
          echo "Checking mutable state projection update"
          PGOPTIONS='-c app.tenant_id=meridian-demo' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE state_snapshots SET values=values WHERE tenant_id='meridian-demo' AND scope_id='memphis-fulfillment'"
          PGOPTIONS='-c app.tenant_id=meridian-demo' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE incidents SET status=status WHERE tenant_id='meridian-demo' AND incident_id='INC-1042'"
          for table in evidence_records proposals human_reviews kernel_decisions mandates shadow_evaluations outcomes; do
            other_count="$(PGOPTIONS='-c app.tenant_id=other-tenant' psql "$DATABASE_URL" -At -c "SELECT count(*) FROM $table")"
            test "$other_count" = 0
          done
          for table in state_snapshots incidents idempotency_keys; do
            if PGOPTIONS='-c app.tenant_id=meridian-demo' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM $table WHERE false"; then exit 1; fi
          done
          if PGOPTIONS='-c app.tenant_id=meridian-demo' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE journal_events SET event_type='TAMPERED'"; then exit 1; fi
          if PGOPTIONS='-c app.tenant_id=meridian-demo' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM journal_events"; then exit 1; fi
          if PGOPTIONS='-c app.tenant_id=meridian-demo' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE receipts SET payload='{}'"; then exit 1; fi
          if PGOPTIONS='-c app.tenant_id=meridian-demo' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM receipts"; then exit 1; fi
          for table in evidence_records proposals human_reviews kernel_decisions mandates shadow_evaluations outcomes; do
            if PGOPTIONS='-c app.tenant_id=meridian-demo' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE $table SET payload=payload WHERE false"; then exit 1; fi
            if PGOPTIONS='-c app.tenant_id=meridian-demo' psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "DELETE FROM $table WHERE false"; then exit 1; fi
          done
          audit="$(PGOPTIONS='-c app.tenant_id=meridian-demo' psql postgresql://cerebrum_audit:validation-only@127.0.0.1:5432/cerebrum_validation -At -c "SELECT count(*) FROM journal_events")"
          test "$audit" -gt 0
          if PGOPTIONS='-c app.tenant_id=meridian-demo' psql postgresql://cerebrum_audit:validation-only@127.0.0.1:5432/cerebrum_validation -v ON_ERROR_STOP=1 -c "DELETE FROM journal_events"; then exit 1; fi
          printf '{"own":%s,"other":%s,"missing":%s,"audit_read":%s,"append_only":"enforced"}\n' "$own" "$other" "$missing" "$audit" > "$ARTIFACT_DIR/postgres-tenant-isolation.json"
      - name: Capture durability baseline
        run: |
          set -euo pipefail
          node scripts/durability-validation.mjs
          PGOPTIONS='-c app.tenant_id=meridian-demo' PGPASSWORD=validation-only psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT 'journal_events='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY event_id)),'empty') FROM journal_events WHERE payload->>'incident_id'='INC-1042' UNION ALL SELECT 'proposals='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY proposal_id)),'empty') FROM proposals WHERE payload->>'incident_id'='INC-1042' UNION ALL SELECT 'kernel_decisions='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY decision_id)),'empty') FROM kernel_decisions WHERE proposal_id='PROP-1042' UNION ALL SELECT 'outcomes='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY outcome_id)),'empty') FROM outcomes WHERE payload->>'proposal_id'='PROP-1042' UNION ALL SELECT 'receipts='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY receipt_id)),'empty') FROM receipts WHERE payload->>'incident_id'='INC-1042' UNION ALL SELECT 'state_snapshot='||coalesce(string_agg(version::text||':'||md5(values::text), ',' ORDER BY scope_id),'empty') FROM state_snapshots WHERE tenant_id='meridian-demo' AND scope_id='memphis-fulfillment'" > $ARTIFACT_DIR/db-durability-baseline.txt
          cat $ARTIFACT_DIR/db-durability-baseline.txt
          test -s $ARTIFACT_DIR/db-durability-baseline.txt
          ! grep -Eq '=0:' $ARTIFACT_DIR/db-durability-baseline.txt
      - name: Restart API and verify durability
        run: |
          set -Eeuo pipefail
          trap 'rc=$?;
            echo "::error::FAILED line=${LINENO} exit=${rc} command=${BASH_COMMAND}";
            for log in "$ARTIFACT_DIR"/api*.log "$ARTIFACT_DIR"/oidc*.log; do
              if test -f "$log"; then echo "::group::$log"; tail -n 200 "$log"; echo "::endgroup::"; fi
            done;
            exit "$rc"' ERR
          echo "Stopping API before restart durability verification"
          api_pid="$(cat $ARTIFACT_DIR/api.pid)"
          if kill "$api_pid" 2>/dev/null; then :; fi
          for i in $(seq 1 30); do
            if kill -0 "$api_pid" 2>/dev/null; then sleep 1; else break; fi
            if test "$i" -eq 30; then echo "API did not stop"; exit 1; fi
          done
          echo "Checking compiled API entrypoints"
          if ! test -f apps/control-plane-api/dist/apps/control-plane-api/src/start.js; then echo "::error::Required file missing: apps/control-plane-api/dist/apps/control-plane-api/src/start.js"; ls -la apps/control-plane-api/dist/apps/control-plane-api/src; exit 1; fi
          if ! test -f apps/control-plane-api/dist/apps/control-plane-api/src/server.js; then echo "::error::Required file missing: apps/control-plane-api/dist/apps/control-plane-api/src/server.js"; ls -la apps/control-plane-api/dist/apps/control-plane-api/src; exit 1; fi
          node apps/control-plane-api/dist/apps/control-plane-api/src/start.js > $ARTIFACT_DIR/api-restart.log 2>&1 & echo $! > $ARTIFACT_DIR/api-restart.pid
          ready=0
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:8787/readyz >/dev/null; then ready=1; break; fi; sleep 1; done
          if test "$ready" -ne 1; then cat $ARTIFACT_DIR/api-restart.log; exit 1; fi
          DURABILITY_MODE=verify node scripts/durability-validation.mjs
          PGOPTIONS='-c app.tenant_id=meridian-demo' PGPASSWORD=validation-only psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT 'journal_events='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY event_id)),'empty') FROM journal_events WHERE payload->>'incident_id'='INC-1042' UNION ALL SELECT 'proposals='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY proposal_id)),'empty') FROM proposals WHERE payload->>'incident_id'='INC-1042' UNION ALL SELECT 'kernel_decisions='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY decision_id)),'empty') FROM kernel_decisions WHERE proposal_id='PROP-1042' UNION ALL SELECT 'outcomes='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY outcome_id)),'empty') FROM outcomes WHERE payload->>'proposal_id'='PROP-1042' UNION ALL SELECT 'receipts='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY receipt_id)),'empty') FROM receipts WHERE payload->>'incident_id'='INC-1042' UNION ALL SELECT 'state_snapshot='||coalesce(string_agg(version::text||':'||md5(values::text), ',' ORDER BY scope_id),'empty') FROM state_snapshots WHERE tenant_id='meridian-demo' AND scope_id='memphis-fulfillment'" > $ARTIFACT_DIR/db-durability-restart.txt
          echo "Comparing restart durability snapshot"
          if ! diff -u "$ARTIFACT_DIR/db-durability-baseline.txt" "$ARTIFACT_DIR/db-durability-restart.txt"; then echo "::error::Database durability snapshot changed after restart"; exit 1; fi
      - name: Backup and restore database
        env:
          PGPASSWORD: validation-only
          PGCONNECT_TIMEOUT: '5'
        run: |
          set -Eeuo pipefail
          trap 'rc=$?;
            echo "::error::FAILED line=${LINENO} exit=${rc} command=${BASH_COMMAND}";
            for log in "$ARTIFACT_DIR"/api*.log "$ARTIFACT_DIR"/oidc*.log; do
              if test -f "$log"; then echo "::group::$log"; tail -n 200 "$log"; echo "::endgroup::"; fi
            done;
            exit "$rc"' ERR
          echo "Creating database backup"
          api_pid="$(cat $ARTIFACT_DIR/api-restart.pid)"
          kill "$api_pid"
          for i in $(seq 1 30); do if kill -0 "$api_pid" 2>/dev/null; then sleep 1; else break; fi; done
          pg_dump \
            -h 127.0.0.1 \
            -U cerebrum_admin \
            -d cerebrum_validation \
            --no-owner \
            --no-acl \
            > $ARTIFACT_DIR/backup.sql
          dropdb \
            --if-exists \
            -h 127.0.0.1 \
            -U cerebrum_admin \
            cerebrum_restore
          createdb \
            -h 127.0.0.1 \
            -U cerebrum_admin \
            cerebrum_restore
          psql \
            -h 127.0.0.1 \
            -U cerebrum_admin \
            -d cerebrum_restore \
            -v ON_ERROR_STOP=1 \
            < $ARTIFACT_DIR/backup.sql
          psql \
            -h 127.0.0.1 \
            -U cerebrum_admin \
            -d cerebrum_restore \
            -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM journal_events;"
          printf '{"backup":"created","restore":"applied"}\n' \
            > $ARTIFACT_DIR/backup-restore.json
          DATABASE_URL="postgresql://cerebrum_admin:validation-only@127.0.0.1:5432/cerebrum_restore" node apps/control-plane-api/dist/apps/control-plane-api/src/start.js > $ARTIFACT_DIR/api-restore.log 2>&1 &
          echo $! > $ARTIFACT_DIR/api-restore.pid
          ready=0
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:8787/readyz >/dev/null; then ready=1; break; fi; sleep 1; done
          if test "$ready" -ne 1; then cat $ARTIFACT_DIR/api-restore.log; exit 1; fi
          DURABILITY_MODE=verify node scripts/durability-validation.mjs
          PGPASSWORD=validation-only psql -h 127.0.0.1 -U cerebrum_admin -d cerebrum_restore -At -v ON_ERROR_STOP=1 -c "SELECT 'journal_events='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY event_id)),'empty') FROM journal_events WHERE payload->>'incident_id'='INC-1042' UNION ALL SELECT 'proposals='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY proposal_id)),'empty') FROM proposals WHERE payload->>'incident_id'='INC-1042' UNION ALL SELECT 'kernel_decisions='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY decision_id)),'empty') FROM kernel_decisions WHERE proposal_id='PROP-1042' UNION ALL SELECT 'outcomes='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY outcome_id)),'empty') FROM outcomes WHERE payload->>'proposal_id'='PROP-1042' UNION ALL SELECT 'receipts='||count(*)||':'||coalesce(md5(string_agg(payload::text, '' ORDER BY receipt_id)),'empty') FROM receipts WHERE payload->>'incident_id'='INC-1042' UNION ALL SELECT 'state_snapshot='||coalesce(string_agg(version::text||':'||md5(values::text), ',' ORDER BY scope_id),'empty') FROM state_snapshots WHERE tenant_id='meridian-demo' AND scope_id='memphis-fulfillment'" > $ARTIFACT_DIR/db-durability-restore.txt
          echo "Comparing restored database durability snapshot"
          if ! diff -u "$ARTIFACT_DIR/db-durability-baseline.txt" "$ARTIFACT_DIR/db-durability-restore.txt"; then echo "::error::Database durability snapshot changed after restore"; exit 1; fi
      - name: Stop services
        if: always()
        run: |
          for pid_file in $ARTIFACT_DIR/api.pid $ARTIFACT_DIR/api-restart.pid $ARTIFACT_DIR/api-restore.pid $ARTIFACT_DIR/oidc.pid; do
            if test -f "$pid_file"; then
              pid="$(cat "$pid_file")"
              if kill -0 "$pid" 2>/dev/null; then kill "$pid" 2>/dev/null; fi
            fi
          done
      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-validation-artifacts
          path: '${{ github.workspace }}/artifacts/'
          if-no-files-found: error
