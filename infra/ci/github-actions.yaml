name: EDON validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: PYTHONPATH=src python -m edon.cli validate .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts tests examples/demo
      - run: PYTHONPATH=src python examples/demo/run_demo.py --output-dir /tmp/edon-demo